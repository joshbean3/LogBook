# fly launch --no-deploy, then: fly volumes create logbook_data --size 1 ; fly secrets set ... ; fly deploy
app = "josh-logbook"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATABASE_PATH = "/data/logbook.db"
  NODE_ENV = "production"
  APP_URL = "https://josh-logbook.fly.dev"
  ALLOW_SETUP = "1"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "logbook_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
