services:
  logbook:
    build:
      context: .
      args:
        # compiled into the web app: the support address, and where the legal pages live when not on this server
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}
        VITE_SITE_ORIGIN: ${VITE_SITE_ORIGIN:-}
    ports:
      - '8787:8787'
    env_file: .env
    environment:
      DATABASE_PATH: /data/logbook.db
      NODE_ENV: production
    volumes:
      - logbook_data:/data
    restart: unless-stopped
volumes:
  logbook_data:
